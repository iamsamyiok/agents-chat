<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>多任务编排</title>
<style>
  :root{
    --bg:#f5f5f5; --panel:#fff; --line:#e7e7e7; --line2:#f0f0f0;
    --txt:#191919; --dim:#888; --acc:#07c160; --acc2:#10aeff; --warn:#e8a33d; --err:#fa5151;
    --pending:#c9cdd4; --running:#10aeff; --done:#07c160; --failed:#fa5151;
    --shadow:0 0 18px rgba(0,0,0,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--txt);font-size:14px}
  header{display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  header h1{font-size:16px;margin:0;font-weight:600}
  .backlink{font-size:13px;color:var(--acc);text-decoration:none;border:1px solid var(--acc);border-radius:6px;padding:5px 10px}
  .backlink:hover{background:#f0faf4}
  .sp{flex:1}
  .btn{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px;transition:.15s}
  .btn:hover{border-color:var(--acc)}
  .btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
  .btn.primary:hover{filter:brightness(1.05)}
  .btn.ghost{border-color:var(--warn);color:var(--warn)}
  .btn.ghost:hover{background:#fdf6ec}
  .btn.danger{border-color:var(--err);color:var(--err)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .status-pill{font-size:12px;color:var(--dim)}
  .ws-box{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
  .ws-box input{border:none;outline:none;font-size:12px;width:200px;background:transparent}
  .ws-box .ws-save{font-size:12px;color:var(--acc);cursor:pointer;white-space:nowrap}
  .ws-box .ws-pick{font-size:12px;color:var(--acc2);cursor:pointer;white-space:nowrap}
  /* 进程状态条 */
  .procbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 18px;background:#0b0d11;color:#e6e9ef;font-size:12px;border-bottom:1px solid #222}
  .procbar .ptitle{color:#9aa3b2;margin-right:4px}
  .proc-chip{display:inline-flex;align-items:center;gap:6px;background:#1a1f29;border:1px solid #2a3340;border-radius:20px;padding:2px 10px}
  .proc-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--done)}
  .proc-chip.idle .dot{background:var(--warn)}
  .proc-chip .pid{font-family:monospace;color:#cfe; }
  .proc-chip .st{color:#9aa3b2}
  .proc-empty{color:#5a6472}
  main{padding:16px 18px;display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
  .col{flex:1;min-width:240px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:var(--shadow)}
  .col h2{font-size:13px;margin:0 0 10px;color:var(--dim);display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.5px}
  .dot{width:8px;height:8px;border-radius:50%}
  .card{background:#fafbfc;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;cursor:grab;transition:.12s;position:relative}
  .card:hover{border-color:var(--acc);box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .card.dragging{opacity:.4}
  .card.drag-over{border-color:var(--acc);border-style:dashed}
  .card .title{font-weight:600;margin-bottom:6px;line-height:1.4;word-break:break-word;padding-right:60px}
  .card .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
  .badge{font-size:11px;padding:2px 7px;border-radius:6px;background:#eef0f3;color:var(--dim);border:1px solid var(--line)}
  .badge.prio-high{background:#fdeaea;color:var(--err);border-color:#f3c9c9}
  .badge.prio-mid{background:#fbf2e0;color:var(--warn);border-color:#f0dcb8}
  .badge.mode-continue{background:#e8f3ff;color:var(--acc2);border-color:#c4e2ff}
  .badge.mode-parallel{background:#f1e9ff;color:#8a6fe8;border-color:#ddd0ff}
  .badge.mode-new{background:#e8f7ed;color:var(--acc);border-color:#c4ecd3}
  .card .op{position:absolute;top:8px;right:8px;display:none;gap:4px}
  .card:hover .op{display:flex}
  .icon-btn{background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:6px;width:24px;height:24px;cursor:pointer;font-size:12px;line-height:1}
  .icon-btn:hover{color:var(--acc);border-color:var(--acc)}
  .empty{color:var(--dim);font-size:12px;text-align:center;padding:18px 0}
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50}
  .mask.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(680px,94vw);max-height:90vh;overflow:auto;padding:20px;box-shadow:var(--shadow)}
  .modal h3{margin:0 0 14px;font-size:16px}
  label{display:block;font-size:12px;color:var(--dim);margin:10px 0 4px}
  input,textarea,select{width:100%;background:#fff;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit}
  textarea{resize:vertical;min-height:90px}
  .row{display:flex;gap:10px}.row>*{flex:1}
  .modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
  .detail-log{background:#0b0d11;border:1px solid var(--line);border-radius:10px;padding:12px;max-height:42vh;overflow:auto;
    font-family:"SFMono-Regular",Consolas,monospace;font-size:12.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word;color:#e6e9ef}
  .detail-log .msg-user{color:#7fd0ff}
  .detail-log .msg-assistant{color:#e6e9ef}
  .detail-log .msg-tool{color:#e0a23b}
  .detail-log .msg-err{color:#ff8a8a}
  .detail-result{background:#fafbfc;border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:12px;white-space:pre-wrap;word-break:break-word;max-height:22vh;overflow:auto;line-height:1.6}
  .dep-tag{font-size:11px;color:var(--acc2);margin-top:4px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 16px;border-radius:10px;z-index:99;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}
  /* 依赖图 */
  #graphMask .modal{width:min(1000px,96vw);height:84vh;display:flex;flex-direction:column;padding:0;overflow:hidden}
  .graph-bar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex:none}
  .graph-bar h3{margin:0;font-size:15px}
  .graph-canvas{flex:1;overflow:auto;background:#fbfcfe;position:relative}
  .flow-svg .g-node{cursor:pointer}
  .flow-svg .g-node rect{fill:#fff;stroke:#d0d5dd;stroke-width:1.6;rx:8}
  .flow-svg .g-node:hover rect{stroke:var(--acc);stroke-width:2.4}
  .flow-svg .g-node.pending rect{stroke:#c9cdd4}
  .flow-svg .g-node.running rect{fill:#eef7ff;stroke:var(--running);stroke-dasharray:5 3}
  .flow-svg .g-node.done rect{fill:#eef7f0;stroke:var(--done)}
  .flow-svg .g-node.failed rect{fill:#fdeceb;stroke:var(--failed)}
  .flow-svg .g-node text{font-size:12px;fill:#222}
  .flow-svg .g-node .gt-sub{font-size:10px;fill:#999}
  .flow-svg .edge{fill:none;stroke:#9aa8c7;stroke-width:1.8}
  .flow-svg .edge.continue{stroke:var(--acc2);stroke-width:1.8;stroke-dasharray:5 3}
  .flow-svg .edge-label{font-size:10px;fill:#667}
  .flow-svg marker{fill:#9aa8c7}
  .flow-svg marker.cont{fill:var(--acc2)}
  /* 垃圾桶 */
  .trash-fab{position:fixed;right:22px;bottom:22px;width:56px;height:56px;border-radius:50%;background:var(--panel);border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.18);cursor:pointer;font-size:24px;display:flex;align-items:center;justify-content:center;z-index:40}
  .trash-fab:hover{border-color:var(--err);color:var(--err)}
  .trash-fab .cnt{position:absolute;top:-6px;right:-6px;background:var(--err);color:#fff;font-size:11px;border-radius:10px;padding:1px 6px}
  #trashMask .modal{width:min(640px,94vw)}
  .trash-item{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
  .trash-item .ti-info{flex:1;min-width:0}
  .trash-item .ti-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .trash-item .ti-sub{font-size:11px;color:var(--dim)}
</style>
</head>
<body>
<header>
  <a class="backlink" href="/" title="返回 Agents Chat 群聊">← 群聊</a>
  <h1>🗂️ 多任务编排</h1>
  <span class="status-pill" id="statusPill">空闲</span>
  <span class="sp"></span>
  <div class="ws-box" title="工作区：选定后 Agent 在该目录读写相关文件（可选）">
    📁 <input id="wsInput" placeholder="工作文件夹（点右侧选择）" />
    <span class="ws-pick" id="wsPick" title="弹窗选择文件夹">选择</span>
    <span class="ws-save" id="wsSave">保存</span>
  </div>
  <button class="btn" id="btnGraph" title="任务依赖关系总览">🔗 依赖图</button>
  <button class="btn" id="btnNew">＋ 新建任务</button>
  <button class="btn primary" id="btnRun">▶ 开始编排</button>
  <button class="btn danger" id="btnStop" disabled>⏹ 停止</button>
  <button class="btn" id="btnClear">清空</button>
</header>

<div class="procbar" id="procBar"><span class="ptitle">进程：</span><span class="proc-empty">无运行中的 opencode 进程</span></div>

<main>
  <div class="col"><h2><span class="dot" style="background:var(--pending)"></span>待执行 <span id="cntPending" class="badge"></span></h2><div id="colPending" class="drop-zone"></div></div>
  <div class="col"><h2><span class="dot" style="background:var(--running)"></span>执行中 <span id="cntRunning" class="badge"></span></h2><div id="colRunning" class="drop-zone"></div></div>
  <div class="col"><h2><span class="dot" style="background:var(--done)"></span>已完成 <span id="cntDone" class="badge"></span></h2><div id="colDone" class="drop-zone"></div></div>
  <div class="col"><h2><span class="dot" style="background:var(--failed)"></span>失败 <span id="cntFailed" class="badge"></span></h2><div id="colFailed" class="drop-zone"></div></div>
</main>

<!-- 新建/编辑任务 -->
<div class="mask" id="maskEdit">
  <div class="modal">
    <h3 id="editTitle">新建任务</h3>
    <label>标题</label>
    <input id="fTitle" placeholder="一句话概括任务" />
    <label>任务内容（描述，支持 Markdown）</label>
    <textarea id="fContent" placeholder="把要做的事详细写在这里，Agent 会据此执行"></textarea>
    <div class="row">
      <div><label>优先级（数字越小越优先）</label><input id="fPriority" type="number" value="999" /></div>
      <div><label>执行模式</label>
        <select id="fMode">
          <option value="new">新进程（new）</option>
          <option value="continue">同会话续聊（continue）</option>
          <option value="parallel">并行独立进程（parallel）</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div><label>续聊链首（仅 continue 模式）</label><select id="fChain"></select></div>
      <div><label>依赖任务（完成后才可执行）</label><select id="fDeps" multiple size="3"></select></div>
    </div>
    <label>模型（留空用默认）</label><input id="fModel" placeholder="provider/model" />
    <div class="foot">
      <button class="btn" id="btnEditCancel">取消</button>
      <button class="btn primary" id="btnEditSave">保存</button>
    </div>
  </div>
</div>

<!-- 任务详情：过程 + 结果 -->
<div class="mask" id="maskDetail">
  <div class="modal">
    <h3 id="dTitle">任务详情</h3>
    <div id="dMeta" class="meta" style="margin-bottom:10px"></div>
    <div class="dep-tag" id="dDeps"></div>
    <label>执行过程（实时）</label>
    <div class="detail-log" id="dLog"><span class="empty">暂无过程记录</span></div>
    <label>最终结果</label>
    <div class="detail-result" id="dResult"><span class="empty">尚未产生结果</span></div>
    <div class="foot">
      <button class="btn" id="dClose">关闭</button>
      <button class="btn primary" id="dRun">▶ 立即执行</button>
    </div>
  </div>
</div>

<!-- 依赖关系总览 -->
<div class="mask" id="graphMask">
  <div class="modal">
    <div class="graph-bar">
      <h3>🔗 任务依赖关系总览</h3>
      <span style="font-size:12px;color:var(--dim)">实线=依赖，蓝色虚线=同会话续聊；箭头指向被依赖项，点击节点查看详情</span>
      <span class="sp" style="flex:1"></span>
      <button class="btn" id="graphClose">关闭</button>
    </div>
    <div class="graph-canvas" id="graphCanvas"></div>
  </div>
</div>

<!-- 垃圾桶 -->
<div class="mask" id="trashMask">
  <div class="modal">
    <h3>🗑️ 垃圾桶 <span style="font-size:12px;color:var(--dim)">（保留 30 天内删除的任务快照）</span></h3>
    <div id="trashList"></div>
    <div class="foot">
      <button class="btn danger" id="trashEmpty">清空垃圾桶</button>
      <button class="btn" id="trashClose">关闭</button>
    </div>
  </div>
</div>

<div class="trash-fab" id="trashFab" title="垃圾桶">🗑️<span class="cnt" id="trashCnt" style="display:none">0</span></div>
<input type="file" id="dirPicker" webkitdirectory directory multiple style="display:none" />

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const api = async (url, opt) => { const r = await fetch(url, opt); return r.json(); };
const post = (url, body) => api(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body||{})});
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}

let CARDS = [];
let OPEN_ID = null;

async function loadCards(){
  const data = await api('/api/cards');
  CARDS = data.cards || [];
  $('#statusPill').textContent = data.running ? '编排中…' : '空闲';
  $('#btnRun').disabled = data.running;
  $('#btnStop').disabled = !data.running;
  if(data.config) $('#wsInput').value = data.config.workspace || '';
  render();
  loadTrashCount();
}

function badge(card){
  let p = card.priority;
  let pc = p<=100?'prio-high':(p<=500?'prio-mid':'');
  let pm = 'mode-'+card.mode;
  let html = `<span class="badge ${pc}">P${p}</span><span class="badge ${pm}">${card.mode}</span>`;
  if(card.dependsOn && card.dependsOn.length) html += `<span class="badge">依赖 ${card.dependsOn.length}</span>`;
  return html;
}
function cardEl(card){
  const el = document.createElement('div');
  el.className='card';
  el.draggable = true;
  el.dataset.id = card.id;
  el.dataset.status = card.status;
  el.innerHTML = `<div class="title">${esc(card.title)}</div>
    <div class="meta">${badge(card)} ${card.status!=='pending'&&card.status!=='running'?`<span class="badge">${card.status}</span>`:''}</div>
    <div class="op">
      <button class="icon-btn" data-act="run" title="执行">▶</button>
      <button class="icon-btn" data-act="edit" title="编辑">✎</button>
      <button class="icon-btn" data-act="del" title="删除">✕</button>
    </div>`;
  el.onclick = (e)=>{ const b=e.target.closest('[data-act]'); if(b){e.stopPropagation(); const a=b.dataset.act;
    if(a==='del') delCard(card.id); else if(a==='edit') openEdit(card); else if(a==='run') runOne(card.id); return; }
    openDetail(card.id); };
  el.addEventListener('dragstart', e=>{ dragId=card.id; el.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; });
  el.addEventListener('dragend', ()=>{ el.classList.remove('dragging'); document.querySelectorAll('.card').forEach(c=>c.classList.remove('drag-over')); });
  el.addEventListener('dragover', e=>{ e.preventDefault(); el.classList.add('drag-over'); });
  el.addEventListener('dragleave', ()=> el.classList.remove('drag-over'));
  el.addEventListener('drop', e=>{ e.preventDefault(); el.classList.remove('drag-over'); onDrop(card.id, el); });
  return el;
}
let dragId=null;
function onDrop(targetId, targetEl){
  if(!dragId || dragId===targetId) return;
  const dragged = document.querySelector(`.card[data-id="${dragId}"]`);
  if(!dragged) return;
  const rect = targetEl.getBoundingClientRect();
  const y = window.__dropY || 0;
  const after = (y > rect.top + rect.height/2);
  if(after) targetEl.parentNode.insertBefore(dragged, targetEl.nextSibling);
  else targetEl.parentNode.insertBefore(dragged, targetEl);
  dragId=null;
  const ids = [...document.querySelectorAll('.card')].map(c=>c.dataset.id);
  post('/api/cards/reorder',{ids}).then(()=>loadCards());
}
document.addEventListener('dragover', e=>{ window.__dropY = e.clientY; }, true);

function render(){
  const cols = {pending:$('#colPending'),running:$('#colRunning'),done:$('#colDone'),failed:$('#colFailed')};
  for(const k in cols) cols[k].innerHTML='';
  let counts={pending:0,running:0,done:0,failed:0};
  for(const c of CARDS){ counts[c.status]=(counts[c.status]||0)+1; (cols[c.status]||cols.pending).appendChild(cardEl(c)); }
  $('#cntPending').textContent=counts.pending||''; $('#cntRunning').textContent=counts.running||'';
  $('#cntDone').textContent=counts.done||''; $('#cntFailed').textContent=counts.failed||'';
  for(const k in cols){ if(!cols[k].children.length) cols[k].innerHTML='<div class="empty">—</div>'; }
}

// ---- 编辑/新建 ----
function fillSelectors(){
  const ch=$('#fChain'); ch.innerHTML='<option value="">（无）</option>'+CARDS.map(c=>`<option value="${c.id}">${esc(c.title)}</option>`).join('');
  const dp=$('#fDeps'); dp.innerHTML=CARDS.map(c=>`<option value="${c.id}">${esc(c.title)}</option>`).join('');
}
let EDIT_ID=null;
function openEdit(card){
  EDIT_ID = card?card.id:null;
  $('#editTitle').textContent = card?'编辑任务':'新建任务';
  $('#fTitle').value = card?card.title:'';
  $('#fContent').value = card?card.content:'';
  $('#fPriority').value = card?card.priority:999;
  $('#fMode').value = card?card.mode:'new';
  $('#fModel').value = card?card.model:'';
  fillSelectors();
  if(card){ $('#fChain').value=card.chainId||''; for(const o of $('#fDeps').options) o.selected=card.dependsOn.includes(o.value); }
  $('#maskEdit').classList.add('show');
}
$('#btnNew').onclick=()=>openEdit(null);
$('#btnEditCancel').onclick=()=>$('#maskEdit').classList.remove('show');
$('#btnEditSave').onclick=async()=>{
  const body={ title:$('#fTitle').value, content:$('#fContent').value, priority:Number($('#fPriority').value)||999,
    mode:$('#fMode').value, chainId:$('#fChain').value, model:$('#fModel').value,
    dependsOn:[...$('#fDeps').selectedOptions].map(o=>o.value) };
  if(EDIT_ID) await api('/api/cards/'+EDIT_ID,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  else await post('/api/cards',body);
  $('#maskEdit').classList.remove('show'); await loadCards(); toast('已保存');
};
async function delCard(id){ if(!confirm('确认删除该任务？将移入垃圾桶（30 天内可还原）。'))return; await api('/api/cards/'+id,{method:'DELETE'}); await loadCards(); toast('已移入垃圾桶'); }
$('#btnClear').onclick=async()=>{ if(!confirm('清空全部任务？将移入垃圾桶（30 天内可还原）。'))return; await post('/api/cards/clear'); await loadCards(); };

// ---- 执行控制 ----
$('#btnRun').onclick=async()=>{ await post('/api/cards/run'); await loadCards(); toast('已开始编排，完成即自动注入下一个任务'); };
$('#btnStop').onclick=async()=>{ await post('/api/cards/stop'); await loadCards(); };
async function runOne(id){ await post('/api/cards/'+id+'/run'); await loadCards(); }

// ---- 工作区（弹窗选择文件夹） ----
$('#wsPick').onclick=()=>{ $('#dirPicker').value=''; $('#dirPicker').click(); };
$('#dirPicker').addEventListener('change', ()=>{
  const f = $('#dirPicker').files && $('#dirPicker').files[0];
  if(!f) return;
  // 优先取绝对路径（Electron/桌面环境），否则取顶层文件夹名（标准浏览器）
  let p = (f.path && typeof f.path === 'string') ? f.path : (f.webkitRelativePath ? f.webkitRelativePath.split('/')[0] : '');
  $('#wsInput').value = p;
  if(p) post('/api/cards/config',{workspace:p}).then(()=>toast('工作区已设为：'+p));
});
$('#wsSave').onclick=async()=>{ const v=$('#wsInput').value.trim(); const r=await post('/api/cards/config',{workspace:v}); if(r.success){ toast(v?'工作区已设为：'+v:'工作区已清除'); } };

// ---- 详情 ----
function appendLog(el, line, cls){
  const span=document.createElement('div'); if(cls) span.className=cls; span.textContent=line; el.appendChild(span);
}
async function openDetail(id){
  OPEN_ID=id; const data=await api('/api/cards/'+id+'/log'); const card=data.card; const msgs=data.messages||[];
  $('#dTitle').textContent=card.title;
  $('#dMeta').innerHTML=badge(card)+`<span class="badge">${card.status}</span>`;
  const depTitles = (card.dependsOn||[]).map(d=>{const c=CARDS.find(x=>x.id===d);return c?c.title:d;});
  $('#dDeps').textContent = depTitles.length ? ('依赖：'+depTitles.join('、')) : '';
  const log=$('#dLog'); log.innerHTML='';
  if(!msgs.length) log.innerHTML='<span class="empty">暂无过程记录</span>';
  for(const m of msgs){
    if(m.role==='user') appendLog(log,'👤 '+m.content,'msg-user');
    else if(/工具|执行完成/.test(m.content||'')) appendLog(log,'🔧 '+m.content,'msg-tool');
    else if(/出错|失败/.test(m.content||'')) appendLog(log,'⚠ '+m.content,'msg-err');
    else appendLog(log,'🤖 '+(m.content||'').slice(0,4000),'msg-assistant');
    if(m.outputPath) appendLog(log,'📄 产出文件: '+m.outputPath);
  }
  const res=$('#dResult');
  if(card.result) res.textContent=card.result; else res.innerHTML='<span class="empty">尚未产生结果</span>';
  $('#dRun').style.display = (card.status==='running')?'none':'inline-block';
  $('#maskDetail').classList.add('show');
}
$('#dClose').onclick=()=>{ OPEN_ID=null; $('#maskDetail').classList.remove('show'); };
$('#dRun').onclick=async()=>{ if(!OPEN_ID)return; await runOne(OPEN_ID); openDetail(OPEN_ID); };

// ---- 依赖关系总览图（带箭头） ----
function openGraph(){
  const cards = CARDS;
  const byId = Object.fromEntries(cards.map(c=>[c.id,c]));
  const depth = {}; const visiting = {};
  function calc(id){
    if(depth[id]!==undefined) return depth[id];
    if(visiting[id]) return 0; visiting[id]=true;
    const c=byId[id]; const deps=(c.dependsOn||[]).filter(d=>byId[d]);
    let d = deps.length ? Math.max(...deps.map(calc))+1 : 0;
    visiting[id]=false; depth[id]=d; return d;
  }
  cards.forEach(c=>calc(c.id));
  const layers = {};
  cards.forEach(c=>{ const d=depth[c.id]||0; (layers[d]=layers[d]||[]).push(c); });
  const maxLayer = Math.max(0,...Object.keys(layers).map(Number));
  const W=124,H=64,xGap=200,yGap=96,padX=46,padY=46;
  const maxRows=Math.max(1,...Object.values(layers).map(a=>a.length));
  const svgW = padX*2 + (maxLayer+1)*xGap;
  const svgH = padY*2 + maxRows*yGap;
  const pos={};
  for(const d of Object.keys(layers)){
    const arr=layers[d]; arr.forEach((c,i)=>{ pos[c.id]={x:padX+d*xGap, y:padY+i*yGap}; });
  }
  let edges='';
  for(const c of cards){
    for(const dep of (c.dependsOn||[])){
      if(!pos[dep]||!pos[c.id]) continue;
      const a=pos[dep], b=pos[c.id];
      const x1=a.x+W, y1=a.y+H/2, x2=b.x, y2=b.y+H/2;
      const mx=(x1+x2)/2;
      const isContinue = (byId[c.id].mode==='continue' && byId[c.id].chainId===dep);
      const marker = isContinue ? 'url(#arCont)' : 'url(#ar)';
      edges += `<path class="edge ${isContinue?'continue':''}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2-4},${y2}" marker-end="${marker}"/>`;
    }
  }
  let nodes='';
  for(const c of cards){
    const p=pos[c.id];
    const label = c.title.length>12? c.title.slice(0,12)+'…' : c.title;
    nodes += `<g class="g-node ${c.status}" data-id="${c.id}">
      <rect x="${p.x}" y="${p.y}" width="${W}" height="${H}" rx="8"/>
      <text x="${p.x+10}" y="${p.y+24}">${esc(label)}</text>
      <text class="gt-sub" x="${p.x+10}" y="${p.y+44}">P${c.priority} · ${c.mode}</text>
    </g>`;
  }
  const svg = `<svg class="flow-svg" width="${svgW}" height="${svgH}" viewBox="0 0 ${svgW} ${svgH}">
    <defs>
      <marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z"/></marker>
      <marker id="arCont" class="cont" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z"/></marker>
    </defs>
    ${edges}${nodes}</svg>`;
  $('#graphCanvas').innerHTML = svg;
  $('#graphCanvas').querySelectorAll('.g-node').forEach(g=>{
    g.onclick=()=>{ const id=g.dataset.id; $('#graphMask').classList.remove('show'); openDetail(id); };
  });
  $('#graphMask').classList.add('show');
}
$('#btnGraph').onclick=openGraph;
$('#graphClose').onclick=()=>$('#graphMask').classList.remove('show');

// ---- 垃圾桶 ----
async function loadTrashCount(){
  const d = await api('/api/cards/trash');
  const n = (d.trash||[]).length;
  const cnt=$('#trashCnt'); cnt.textContent=n; cnt.style.display = n? 'block':'none';
}
async function openTrash(){
  const d = await api('/api/cards/trash');
  const list = d.trash||[];
  const box=$('#trashList');
  if(!list.length){ box.innerHTML='<div class="empty">垃圾桶是空的</div>'; }
  else {
    box.innerHTML = list.map(t=>{
      const c=t.card; const dt=new Date(t.deletedAt).toLocaleString();
      const left = Math.max(0, 30 - Math.floor((Date.now()-t.deletedAt)/(24*3600*1000)));
      return `<div class="trash-item">
        <div class="ti-info">
          <div class="ti-title">${esc(c.title||'未命名任务')}</div>
          <div class="ti-sub">删除于 ${dt} · 剩余保留约 ${left} 天 · ${c.status||''}</div>
        </div>
        <button class="btn" data-restore="${c.id}">还原</button>
      </div>`;
    }).join('');
    box.querySelectorAll('[data-restore]').forEach(b=>{
      b.onclick=async()=>{ await post('/api/cards/trash/restore/'+encodeURIComponent(b.dataset.restore)); await loadCards(); toast('已还原'); };
    });
  }
  $('#trashMask').classList.add('show');
}
$('#trashFab').onclick=openTrash;
$('#trashClose').onclick=()=>$('#trashMask').classList.remove('show');
$('#trashEmpty').onclick=async()=>{ if(!confirm('确认清空垃圾桶？所有快照及其过程日志将被永久删除，不可恢复。'))return; const r=await post('/api/cards/trash/empty'); toast('已清空 '+r.cleared+' 项'); await loadCards(); };

// ---- 进程状态条（PID + 是否工作中） ----
async function refreshProcs(){
  try{
    const d = await api('/api/cards/processes');
    const procs = d.processes||[];
    const bar=$('#procBar');
    if(!procs.length){ bar.innerHTML='<span class="ptitle">进程：</span><span class="proc-empty">无运行中的 opencode 进程</span>'; return; }
    bar.innerHTML='<span class="ptitle">进程：</span>'+procs.map(p=>{
      const working=p.working;
      return `<span class="proc-chip ${working?'':'idle'}"><span class="dot"></span><span class="pid">PID ${p.pid}</span><span class="st">${working?'工作中':'空闲'}</span></span>`;
    }).join('');
  }catch{ /* ignore */ }
}
setInterval(refreshProcs, 2000);

// ---- SSE 实时 ----
const es = new EventSource('/api/cards/stream');
es.onmessage = (e)=>{
  let ev; try{ ev=JSON.parse(e.data); }catch{ return; }
  if(ev.type==='runner_started'){ $('#statusPill').textContent='编排中…'; $('#btnRun').disabled=true; $('#btnStop').disabled=false; }
  if(ev.type==='runner_stopped'||ev.type==='all_done'){ $('#statusPill').textContent='空闲'; $('#btnRun').disabled=false; $('#btnStop').disabled=true; }
  if(['task_start','text','tool','task_done','proc'].includes(ev.type)){
    loadCards();
    refreshProcs();
    if(OPEN_ID && ev.cardId===OPEN_ID){
      const log=$('#dLog'); if(log.querySelector('.empty')) log.innerHTML='';
      if(ev.type==='text') appendLog(log,(ev.text||'').slice(0,4000),'msg-assistant');
      else if(ev.type==='tool') appendLog(log,'🔧 ['+ev.name+'] '+(ev.summary||''),'msg-tool');
      else if(ev.type==='task_done'){ loadCards().then(()=>openDetail(OPEN_ID)); }
      log.scrollTop=log.scrollHeight;
    }
  }
};
es.onerror=()=>{};

loadCards();
</script>
