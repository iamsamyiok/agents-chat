# 桌面版（Electron exe）自动构建
# 触发：手动（workflow_dispatch）或推送 v* 标签（发版时自动出安装包挂 Release）
# 产物：AgentsChat-Setup-<版本>.exe（NSIS 安装版）+ AgentsChat-Portable-<版本>.exe（免安装便携版）
name: Desktop Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write # tag 触发时把产物挂到对应 GitHub Release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 无 lockfile（仓库 .gitignore 排除），用 install 解析依赖；
      # CI 无 AI 内核：关闭 postinstall 的自动安装 opencode（与构建无关，省 1-2 分钟）
      - name: Install dependencies
        run: npm install --no-audit --no-fund
        env:
          AGENTS_CHAT_AUTO_INSTALL: '0'

      - name: Build desktop exe
        run: npm run desktop:build -- --win
        env:
          # Windows GUI 形态由本地常备内核路径兜底逻辑覆盖，构建期无需真实内核
          AGENTS_CHAT_AUTO_INSTALL: '0'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agents-chat-desktop-windows
          path: |
            dist-desktop/*.exe
            dist-desktop/*.blockmap
          if-no-files-found: error

      # 推 tag（发版）时把安装包挂到同名 Release；手动触发仅留 artifact
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release upload "$env:GITHUB_REF_NAME" (Get-ChildItem dist-desktop/*.exe) (Get-ChildItem dist-desktop/*.blockmap) --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
