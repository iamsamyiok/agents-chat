<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人主页</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --c1: #7f5af0;
    --c2: #2cb67d;
    --c3: #ff6ec7;
  }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #fff;
    background: #0b0b14;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 流动渐变背景 */
  .bg {
    position: fixed;
    inset: -50%;
    background:
      radial-gradient(circle at 20% 30%, var(--c1), transparent 40%),
      radial-gradient(circle at 80% 70%, var(--c2), transparent 40%),
      radial-gradient(circle at 50% 80%, var(--c3), transparent 45%);
    filter: blur(80px);
    opacity: .55;
    animation: drift 18s ease-in-out infinite alternate;
    z-index: 0;
  }
  @keyframes drift {
    0%   { transform: translate(0,0) scale(1); }
    50%  { transform: translate(4%, -3%) scale(1.1); }
    100% { transform: translate(-3%, 4%) scale(1.05); }
  }

  .card {
    position: relative;
    z-index: 1;
    width: min(90vw, 380px);
    padding: 40px 32px;
    text-align: center;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 24px;
    backdrop-filter: blur(14px);
    box-shadow: 0 8px 40px rgba(0,0,0,.4);
    animation: rise .9s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(28px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .avatar {
    width: 96px; height: 96px;
    margin: 0 auto 20px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 40px; font-weight: 700;
    background: linear-gradient(135deg, var(--c1), var(--c3));
    box-shadow: 0 0 30px rgba(127,90,240,.6);
    animation: pulse 3s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 25px rgba(127,90,240,.55); }
    50%     { box-shadow: 0 0 45px rgba(255,110,199,.75); }
  }

  h1 {
    font-size: 26px;
    letter-spacing: 1px;
    background: linear-gradient(90deg, var(--c1), var(--c2), var(--c3));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .type {
    margin-top: 12px;
    min-height: 22px;
    font-size: 15px;
    color: #c8c8e0;
  }
  .type::after {
    content: "▋";
    margin-left: 2px;
    animation: blink 1s steps(1) infinite;
    color: var(--c2);
  }
  @keyframes blink { 50% { opacity: 0; } }

  .links {
    margin-top: 28px;
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .links a {
    padding: 10px 18px;
    border-radius: 999px;
    text-decoration: none;
    color: #fff;
    font-size: 14px;
    border: 1px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.05);
    transition: .25s;
  }
  .links a:hover {
    transform: translateY(-3px);
    border-color: var(--c1);
    box-shadow: 0 6px 22px rgba(127,90,240,.6);
    background: rgba(127,90,240,.18);
  }

  .foot {
    margin-top: 26px;
    font-size: 12px;
    color: #7a7a92;
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="card">
    <div class="avatar">X</div>
    <h1>你的名字</h1>
    <div class="type" id="type"></div>
    <div class="links">
      <a href="#">GitHub</a>
      <a href="#">Email</a>
      <a href="#">Blog</a>
    </div>
    <div class="foot">© 2026 · Made with ✨</div>
  </div>

<script>
  const phrases = ["你好，欢迎来到我的主页", "我热爱设计与代码", "正在创造有趣的东西", "让我们一起构建未来"];
  const el = document.getElementById("type");
  let p = 0, c = 0, deleting = false;
  function tick() {
    const cur = phrases[p];
    el.textContent = deleting ? cur.slice(0, --c) : cur.slice(0, ++c);
    let delay = deleting ? 45 : 95;
    if (!deleting && c === cur.length) { delay = 1500; deleting = true; }
    else if (deleting && c === 0) { deleting = false; p = (p + 1) % phrases.length; delay = 400; }
    setTimeout(tick, delay);
  }
  tick();
</script>
</body>
</html>
